name: Publish Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly rebuild: the week's Debian security updates. The pinned digests,
    # the mc commit and the Go module patch never move in this build: a commit
    # on main moves them, a person's or, for a base re-pushed with the same
    # toolchain, the fleet triage's.
    - cron: "35 6 * * 1"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: heyvaldemar/minio-client

jobs:
  lint:
    name: Lint Dockerfile and shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

      # Bitnami's scripts under bitnami/ are linted where they are written;
      # tests/vendored-scripts.sh checks they are Bitnami's.
      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck scripts/*.sh tests/*.sh

  version:
    name: The mc release the Dockerfile builds
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag Bitnami used for an mc release, year.month.day without
      # leading zeros, read from the pinned release and checked against
      # APP_VERSION, so the two cannot drift apart.
      - name: Read it from the pin
        id: v
        run: |
          set -euo pipefail
          release="$(sed -nE 's/^ARG MC=(RELEASE\.[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z):[0-9a-f]{40}$/\1/p' Dockerfile | sort -u)"
          [ "$(printf '%s\n' "$release" | grep -c .)" = 1 ] || { echo "::error::the Dockerfile does not pin one mc release as RELEASE.<time>:<commit> (got '${release}')"; exit 1; }
          d="${release#RELEASE.}"; d="${d%%T*}"
          version="$((10#${d:0:4})).$((10#${d:5:2})).$((10#${d:8:2}))"
          app="$(sed -nE 's/^ARG APP_VERSION=([0-9.]+)$/\1/p' Dockerfile)"
          [ "$app" = "$version" ] || { echo "::error::APP_VERSION is '${app}', the pinned ${release} is ${version}"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mc ${release}, tagged ${version}"

  test:
    name: Test before it is published
    runs-on: ubuntu-latest
    needs: [lint, version]
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image for this runner
        run: docker build -t minio-client:test .

      # Every script under bitnami/scripts is Bitnami's, byte for byte, but
      # the two changes bitnami/NOTICE names.
      - name: Bitnami's scripts are Bitnami's
        run: ./tests/vendored-scripts.sh

      # The same user, working directory, entrypoint, command, PATH, HOME,
      # /.mc and scripts as the last versioned bitnami/minio-client, every
      # executable on its PATH or a reason, and both images run against one
      # MinIO server each way bitnami/minio-client is used.
      - name: A drop-in for bitnami/minio-client
        run: ./tests/drop-in-test.sh minio-client:test

      # MinIO's own functional tests for mc, from the commit this builds,
      # on this image's mc: what says the raised modules left it working.
      - name: mc's own functional tests pass
        run: ./tests/mc-functional.sh minio-client:test

      # No critical or high finding that a rebuild can remove.
      - name: No fixable critical or high finding
        run: ./scripts/cve-gate.sh minio-client:test

      # Nothing a Job used yesterday is gone today.
      - name: The contract with what is already published
        run: ./scripts/contract-test.sh minio-client:test "${IMAGE_NAME}:latest"

      # Bitnami's own MinIO chart, on a fresh kind cluster, with this image
      # as its client, configured from the chart's own Secret.
      - name: Bitnami's MinIO chart works with it as its client
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker tag minio-client:test "minio-client:${VERSION}"
          ./tests/charts-e2e.sh "minio-client:${VERSION}"

  plants:
    name: The tests, shown each violation they exist for
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every plant is caught
        run: python3 tests/plant-violations.py -- bash -c "./tests/vendored-scripts.sh >/dev/null 2>&1 && docker build -q -t minio-client:plant . >/dev/null 2>&1 && ./tests/drop-in-test.sh minio-client:plant >/dev/null 2>&1 && ./scripts/cve-gate.sh minio-client:plant >/dev/null 2>&1"

  # The steps that sign, attest and read back a published image, shown each
  # failure they exist for. It runs the same action the build job runs after
  # its push (.github/actions/sign-attest-verify), on throwaway images in a
  # registry on this runner, signed with keys made here: nothing reaches
  # Docker Hub, GitHub's attestation store or Sigstore's public log. The cases:
  # nothing planted; the real attestation step failing, as Rekor made
  # aws-kubectl's fail on 2 November 2026 (this job has no OIDC token, so it
  # fails before it contacts anything); signing failing; signing skipped without a word; a tag
  # another run moved to an image signed by a stranger's key; a push that
  # stopped half way. tests/signing-plants.sh says what each must show.
  signing:
    name: Signing, shown each failure it must survive
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 15
    # No id-token: write, ever. Without it the attestation step can only
    # fail, and setup refuses to run if a token is available.
    permissions:
      contents: read
    env:
      OWN_SIGNATURE_WAIT: "15"
    services:
      registry:
        image: registry:3.1.2@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
        ports:
          - 5000:5000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v2.6.1"

      - name: Throwaway keys, and an image for each case in the local registry
        id: setup
        run: ./tests/signing-plants.sh setup

      - name: Nothing planted
        id: untouched
        continue-on-error: true
        uses: ./.github/actions/sign-attest-verify
        with:
          image: localhost:5000/untouched
          digest: ${{ steps.setup.outputs.untouched }}
          tags: |
            localhost:5000/untouched:latest
            localhost:5000/untouched:edge
          plant: none
          cosign-key: ${{ steps.setup.outputs.key }}

      - name: "Plant: the attestation fails"
        id: attest_fails
        continue-on-error: true
        uses: ./.github/actions/sign-attest-verify
        with:
          image: localhost:5000/attest-fails
          digest: ${{ steps.setup.outputs.attest_fails }}
          tags: |
            localhost:5000/attest-fails:latest
            localhost:5000/attest-fails:kube-1.37
          plant: attest-fails
          cosign-key: ${{ steps.setup.outputs.key }}

      - name: "Plant: signing fails"
        id: sign_fails
        continue-on-error: true
        uses: ./.github/actions/sign-attest-verify
        with:
          image: localhost:5000/sign-fails
          digest: ${{ steps.setup.outputs.sign_fails }}
          tags: localhost:5000/sign-fails:latest
          plant: sign-fails
          cosign-key: ${{ steps.setup.outputs.key }}

      - name: "Plant: signing is skipped without a word"
        id: sign_skipped
        continue-on-error: true
        uses: ./.github/actions/sign-attest-verify
        with:
          image: localhost:5000/sign-skipped
          digest: ${{ steps.setup.outputs.sign_skipped }}
          tags: |
            localhost:5000/sign-skipped:latest
            localhost:5000/sign-skipped:edge
          plant: sign-skipped
          cosign-key: ${{ steps.setup.outputs.key }}

      - name: "Plant: another run moved a tag to an image this workflow did not sign"
        id: moved
        continue-on-error: true
        uses: ./.github/actions/sign-attest-verify
        with:
          image: localhost:5000/moved
          digest: ${{ steps.setup.outputs.moved }}
          tags: |
            localhost:5000/moved:main
            localhost:5000/moved:kube-1.37
          other-run-wait: "20"
          plant: none
          cosign-key: ${{ steps.setup.outputs.key }}

      - name: "Plant: the push stopped half way"
        id: unfinished
        continue-on-error: true
        uses: ./.github/actions/sign-attest-verify
        with:
          image: localhost:5000/unfinished
          digest: ""
          tags: |
            localhost:5000/unfinished:2.3.1
            localhost:5000/unfinished:2.3
          other-run-wait: "0"
          plant: none
          cosign-key: ${{ steps.setup.outputs.key }}

      - name: Each failure was noticed, and every image this run built is signed
        env:
          KEY: ${{ steps.setup.outputs.key }}
          UNTOUCHED: ${{ steps.setup.outputs.untouched }}
          ATTEST_FAILS: ${{ steps.setup.outputs.attest_fails }}
          SIGN_FAILS: ${{ steps.setup.outputs.sign_fails }}
          SIGN_SKIPPED: ${{ steps.setup.outputs.sign_skipped }}
          MOVED: ${{ steps.setup.outputs.moved }}
          MOVED_OTHER: ${{ steps.setup.outputs.moved_other }}
          UNFINISHED: ${{ steps.setup.outputs.unfinished }}
          UNTOUCHED_OUTCOME: ${{ steps.untouched.outcome }}
          ATTEST_FAILS_OUTCOME: ${{ steps.attest_fails.outcome }}
          SIGN_FAILS_OUTCOME: ${{ steps.sign_fails.outcome }}
          SIGN_SKIPPED_OUTCOME: ${{ steps.sign_skipped.outcome }}
          MOVED_OUTCOME: ${{ steps.moved.outcome }}
          UNFINISHED_OUTCOME: ${{ steps.unfinished.outcome }}
        run: ./tests/signing-plants.sh check

  build:
    name: Build and publish
    runs-on: ubuntu-latest
    # Nothing is published that the tests have not passed, or whose tests
    # have not been seen to fail.
    needs: [lint, version, test, plants, signing]
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      published: ${{ steps.creds.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A push before the secrets exist builds both platforms, tests nothing
      # less, and publishes nothing, with a warning. A scheduled or manual run
      # without them fails, so a weekly rebuild never goes quiet.
      - name: Docker Hub credentials are set
        id: creds
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "::warning::this repository has no DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secret yet: built and tested, not published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::this repository has no DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secret; add both (a Docker Hub access token with write access to heyvaldemar/minio-client) and run the workflow again"
            exit 1
          fi

      - name: Compute build metadata
        id: meta-build
        run: |
          set -euo pipefail
          {
            echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "vcs_ref=${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub
        if: steps.creds.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The mc release as Bitnami tagged it (2025.8.13), and latest. Both move
      # with the weekly rebuild, so a pinned tag still receives security
      # updates; pin a digest for an image that never changes.
      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=minio-client
            org.opencontainers.image.description=mc, the MinIO Client, rebuilt from its last release on Debian 13, rebuilt weekly, signed; a drop-in for bitnami/minio-client. Not affiliated with or endorsed by MinIO, Inc.
            org.opencontainers.image.vendor=heyvaldemar
            org.opencontainers.image.licenses=AGPL-3.0-or-later AND Apache-2.0 AND MIT
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        timeout-minutes: 30
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.creds.outputs.publish == 'true' }}
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ steps.meta-build.outputs.vcs_ref }}
            BUILD_DATE=${{ steps.meta-build.outputs.build_date }}
          # No cache from earlier runs: the weekly rebuild exists to take the
          # week's Debian updates, which a cached apt layer would skip.
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=minio-client
          cache-to: type=gha,mode=max,scope=minio-client
          sbom: true
          provenance: mode=max

      # SIGN FIRST, THEN ATTEST, THEN READ BACK WHAT DOCKER HUB SERVES. The
      # cosign steps used to follow the attestation and ran only if it
      # succeeded; in aws-kubectl, which had the same steps, a Rekor 502 on
      # 2 November 2026 left three tags on an unsigned image for 37 hours. Now
      # the pushed digest is signed whatever the attestation does, an
      # attestation that fails still fails the job, and then every tag pushed
      # here is read back from Docker Hub: the digest it names must carry a
      # cosign signature that verifies as this workflow, or the job fails (and
      # a digest this job built is signed again). It runs even when the push
      # failed half way: the build reports no digest then, so the tags it
      # already moved are reported, not signed. The signing job above runs the
      # same action with each failure planted.
      - name: Sign, attest, and read back every pushed tag from Docker Hub
        if: ${{ !cancelled() && steps.creds.outputs.publish == 'true' && steps.meta.outcome == 'success' }}
        uses: ./.github/actions/sign-attest-verify
        with:
          image: ${{ env.IMAGE_NAME }}
          digest: ${{ steps.build.outcome == 'success' && steps.build.outputs.digest || '' }}
          tags: ${{ steps.meta.outputs.tags }}

  scan-trivy:
    name: Scan the published image with Trivy
    runs-on: ubuntu-latest
    needs: [build]
    if: needs.build.outputs.published == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Findings do not fail this job; a scan that cannot finish does.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy-minio-client

  measure:
    name: CVE counts against the image it replaces
    runs-on: ubuntu-latest
    needs: [build]
    if: needs.build.outputs.published == 'true'
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Count
        env:
          PLATFORM: linux/amd64
        run: |
          set -o pipefail
          ./scripts/measure-cves.sh "${IMAGE_NAME}:latest" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the counts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cves
          path: reports/
          retention-days: 90

  # The ruleset requires checks by names that stay put. This one stands for
  # every job the publish depends on, and fails if any failed or was skipped.
  published:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: [lint, version, test, plants, signing, build]
    if: always()
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every job it stands for passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "lint, version, test, plants, signing, build: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::a job this one stands for ended '$r'"; exit 1; }
          done

  dockerhub-description:
    name: Sync Docker Hub description
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.published == 'true'
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          short-description: "The last MinIO Client release, rebuilt and signed. Bitnami drop-in. Not affiliated with MinIO, Inc."
          readme-filepath: ./README.md
