name: Something does not work
description: mc fails here where it worked, or a Job, compose service or script written for bitnami/minio-client does not run this image.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Three of the four questions below exist because the answer usually
        contains the problem. The one that matters most is the last: the
        output, unedited.

  - type: input
    id: image
    attributes:
      label: Which image
      description: The tag, and the digest if you pinned one (`docker buildx imagetools inspect heyvaldemar/minio-client:latest`).
      placeholder: "heyvaldemar/minio-client:2025.8.13"
    validations:
      required: true

  - type: textarea
    id: how
    attributes:
      label: How it runs
      description: The Job or compose service with the MINIO_SERVER_* variables it sets (values redacted), or the exact `docker run` command, and the server it talks to.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: The output, unedited
      description: |
        `kubectl logs <pod>` (or `docker logs <container>`), including the
        lines Bitnami's scripts print before mc's own.
        Redact hostnames, keys and passwords; leave everything else.
      render: shell
    validations:
      required: true
